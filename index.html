<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <title>馬上槍試合</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-card">
      <h1>馬上槍試合</h1>
      <p class="subtitle">オンライン1vs1 — 横画面でプレイ</p>

      <div id="lobby-menu">
        <input type="text" id="player-name" placeholder="名前" maxlength="12">
        <button id="btn-create" class="action-btn full">ルームを作成</button>
        <button id="btn-join-open" class="action-btn full secondary">ルームに参加</button>
      </div>

      <div id="lobby-join" class="hidden">
        <input type="text" id="room-code-input" placeholder="ルームコード" maxlength="6" autocapitalize="characters">
        <button id="btn-join" class="action-btn full">参加する</button>
        <button id="btn-join-back" class="text-btn">戻る</button>
      </div>

      <p id="lobby-error" class="error-msg hidden"></p>
      <p id="connection-status" class="status-msg">接続中…</p>
    </div>
  </div>

  <!-- Game (1画面完結) -->
  <div id="screen-game" class="screen">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-num">3</span>
      </div>

      <div id="verdict-display" class="verdict-display hidden">
        <span id="verdict-text">PERFECT</span>
      </div>

      <div id="result-overlay" class="result-overlay hidden">
        <h2 id="result-title">勝利！</h2>
        <p id="result-detail"></p>
        <button id="btn-rematch" class="action-btn">再戦</button>
        <p id="rematch-status" class="rematch-hint hidden"></p>
        <button id="btn-back-lobby" class="text-btn">ロビーへ</button>
      </div>

      <div id="ready-bar" class="ready-bar hidden">
        <button id="btn-leave" class="text-btn leave-btn">退出</button>
        <p id="opp-ready-hint">相手を待っています…</p>
        <button id="btn-ready" class="action-btn ready-btn">READY</button>
      </div>
    </div>

    <!-- 槍の高さゲージ -->
    <div id="lance-gauge" class="lance-gauge hidden">
      <div class="gauge-zone zone-high">HIGH</div>
      <div class="gauge-zone zone-perfect">PERFECT</div>
      <div class="gauge-zone zone-low">LOW</div>
      <div id="gauge-marker" class="gauge-marker"></div>
    </div>

    <div id="drag-hint" class="drag-hint hidden">上下にドラッグで槍の高さ</div>

    <div id="rotate-hint" class="rotate-hint hidden">
      <p>端末を<strong>横向き</strong>にしてください</p>
    </div>
  </div>

  <script src="/shared/constants.js"></script>
  <script src="/shared/sim.js"></script>
  <script src="renderer2d.js"></script>
  <script src="client.js"></script>
</body>
</html>
