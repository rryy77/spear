<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROCK YOU! — 馬上槍試合</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-card">
      <h1>ROCK YOU!</h1>
      <p class="subtitle">14世紀・馬上槍試合 — オンライン対戦</p>
      <p class="rules-hint">
        騎士Aと騎士Bがリストの両端から向かい合い、<br>
        一斉に突撃して槍を突き合わせます。
      </p>

      <div id="lobby-menu">
        <input type="text" id="player-name" placeholder="騎士の名前" maxlength="12">
        <button id="btn-create" class="action-btn full">ルームを作成（騎士A）</button>
        <button id="btn-join-open" class="action-btn full secondary">ルームに参加（騎士B）</button>
      </div>

      <div id="lobby-join" class="hidden">
        <p class="hint">ルームコードを入力</p>
        <input type="text" id="room-code-input" placeholder="例: A1B2C3" maxlength="6" autocapitalize="characters">
        <button id="btn-join" class="action-btn full">参加する</button>
        <button id="btn-join-back" class="text-btn">戻る</button>
      </div>

      <div id="lobby-waiting" class="hidden">
        <p class="room-code-label">ルームコード</p>
        <p class="room-code" id="display-code">------</p>
        <p class="hint" id="waiting-message">対戦相手の参加を待っています…</p>
        <button id="btn-start" class="action-btn full hidden">ゲームスタート</button>
        <button id="btn-leave" class="text-btn">ルームを退出</button>
      </div>

      <p id="lobby-error" class="error-msg hidden"></p>
      <p id="connection-status" class="status-msg">接続中…</p>
    </div>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen">
    <canvas id="game-canvas"></canvas>
    <div id="blood-overlay"></div>

    <!-- BF-style HUD -->
    <div id="hud">
      <div class="hud-compass">
        <div class="compass-bar">
          <span class="compass-mark">W</span>
          <span class="compass-mark active">N</span>
          <span class="compass-mark">E</span>
        </div>
        <p id="hud-objective" class="hud-objective">馬上槍試合</p>
      </div>

      <div class="hud-topline">
        <span id="hud-round">ROUND 1</span>
        <span id="hud-role" class="hud-role">騎士A</span>
      </div>

      <div id="crosshair">
        <div class="ch-dot"></div>
        <div class="ch-line ch-t"></div>
        <div class="ch-line ch-b"></div>
        <div class="ch-line ch-l"></div>
        <div class="ch-line ch-r"></div>
      </div>

      <div class="hud-armor">
        <div class="armor-stat">
          <span class="armor-label">HEAD</span>
          <span class="armor-num" id="val-head">100</span>
          <div class="armor-bar"><div class="armor-fill" id="armor-head"></div></div>
        </div>
        <div class="armor-stat">
          <span class="armor-label">BODY</span>
          <span class="armor-num" id="val-torso">100</span>
          <div class="armor-bar"><div class="armor-fill" id="armor-torso"></div></div>
        </div>
        <div class="armor-stat">
          <span class="armor-label">LEGS</span>
          <span class="armor-num" id="val-legs">100</span>
          <div class="armor-bar"><div class="armor-fill" id="armor-legs"></div></div>
        </div>
      </div>

      <div class="hud-opp">
        <span class="opp-tag">ENEMY</span>
        <span id="opp-name">—</span>
        <span id="opp-armor">H100 B100 L100</span>
      </div>

      <div id="phase-banner" class="phase-banner hidden"></div>
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-num">3</span>
      </div>
      <div id="aim-bar-wrap" class="aim-bar-wrap hidden">
        <div id="aim-bar" class="aim-bar"></div>
      </div>
    </div>

    <div class="controls" id="game-controls">
      <p class="ctrl-hint">◀▶ 左右　▲▼ 槍の高さ</p>
      <button class="arrow-btn" data-dir="up">▲</button>
      <div class="arrow-row">
        <button class="arrow-btn" data-dir="left">◀</button>
        <button class="arrow-btn" data-dir="down">▼</button>
        <button class="arrow-btn" data-dir="right">▶</button>
      </div>
    </div>

    <div id="result-toast" class="hidden"></div>
  </div>

  <!-- Game Over -->
  <div id="screen-result" class="screen">
    <div class="lobby-card">
      <h2 id="result-title">試合終了</h2>
      <p id="result-message"></p>
      <button id="btn-back-lobby" class="action-btn full">ロビーに戻る</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="renderer3d.js"></script>
  <script src="client.js"></script>
</body>
</html>
